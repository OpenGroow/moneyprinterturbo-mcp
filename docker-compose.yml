x-mpt: &mpt
  image: ${MPT_IMAGE:?copy .env.example to .env}
  volumes:
    - ./config.toml:/MoneyPrinterTurbo/config.toml
    - ./storage:/MoneyPrinterTurbo/storage

services:
  mpt-api:
    <<: *mpt
    command: ["python3", "main.py"]
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/docs')"]
      interval: 10s
      retries: 6

  mpt-webui:
    <<: *mpt
    profiles: ["webui"]
    ports:
      - "127.0.0.1:8501:8501"

  mcp:
    build:
      context: .
      target: dev
    env_file: .env
    environment:
      MPT_BASE_URL: http://mpt-api:8080
      MPT_API_KEY: ${MPT_API_KEY:-}
      MPT_DRY_RUN: ${MPT_DRY_RUN:-false}
    ports:
      - "127.0.0.1:${PORT:?copy .env.example to .env}:${PORT}"
    volumes:
      - ./src:/app/src
    depends_on:
      mpt-api:
        condition: service_healthy
